[package]
name = "ratex-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pecia FFI shell for RaTeX: LaTeX formula -> SVG string (glyph-outlined, fonts embedded)."

[lib]
name = "ratex_ffi"
crate-type = ["staticlib"]

[dependencies]
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
codegen-units = 1
